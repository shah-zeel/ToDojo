# pyproject.toml
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "todojo"
version = "0.1.0"
description = "A cli todo app to manage all your todos"
license = {text = "MIT"}
readme = "README.md"
authors = [{ name = "Zeel Tejashkumar Shah" }]
dependencies = []
requires-python = ">=3.7"

[project.urls]
"Homepage" = "https://github.com/shah-zeel/ToDojo"

[project.scripts]
todojo = "todojo:main"